spring.application.name=ProjectSagant

# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/notifications_db
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- RabbitMQ ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# --- Mail (Mailhog) ---
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}

# --- JWT ---
app.jwt.secret=${JWT_SECRET:change-this-secret-in-production-please-make-it-long}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# --- Auth (credenciales de prueba, ver README) ---
app.auth.username=${AUTH_USERNAME:admin}
app.auth.password=${AUTH_PASSWORD:admin123}

# --- Actuator ---
management.endpoints.web.exposure.include=health